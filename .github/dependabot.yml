version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: npm
    directories: [/, /desktop]
    schedule: { interval: monthly }
    groups:
      npm: { patterns: ["*"] }
  - package-ecosystem: cargo
    directory: /desktop
    schedule: { interval: monthly }
    groups:
      cargo: { patterns: ["*"] }
  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: monthly }
    groups:
      gradle: { patterns: ["*"] }
