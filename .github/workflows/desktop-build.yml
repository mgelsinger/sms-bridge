name: desktop

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core tests, lint, frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Install the mock phone (used by the core integration tests)
        run: npm ci
      - name: Core tests and lint
        working-directory: desktop
        run: |
          set -o pipefail
          {
            cargo fmt --all --check &&
            cargo test -p sms-bridge-core &&
            cargo clippy -p sms-bridge-core --all-targets -- -D warnings &&
            npm ci &&
            npm run typecheck &&
            npm test
          } 2>&1 | tee ../core.log
      - if: failure()
        run: node tools/ci/annotate.mjs core.log "desktop core"

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Lint and build the installer
        working-directory: desktop
        shell: bash
        run: |
          set -o pipefail
          {
            npm ci &&
            cargo clippy --workspace --all-targets -- -D warnings &&
            npx tauri build --bundles nsis
          } 2>&1 | tee ../windows.log
      - if: failure()
        shell: bash
        run: node tools/ci/annotate.mjs windows.log "windows"
      - uses: actions/upload-artifact@v7
        with:
          name: sms-bridge-windows-installer
          path: desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    name: Publish dev installer
    needs: [core, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sms-bridge-windows-installer
      - id: tag
        run: echo "tag=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - run: for f in *.exe; do mv "$f" "SMS-Bridge-${{ steps.tag.outputs.tag }}-setup.exe"; done
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Dev build ${{ steps.tag.outputs.tag }}
          prerelease: true
          make_latest: false
          body: |
            Automatic development build of ${{ github.sha }}. Not for general use.
            Install the APK on your phone; install the Windows .exe on your PC.
          files: SMS-Bridge-*-setup.exe
