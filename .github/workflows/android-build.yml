name: android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and assemble
        run: set -o pipefail; ./gradlew --no-daemon --stacktrace test assembleDebug 2>&1 | tee ../android.log
      - if: failure()
        working-directory: .
        run: node tools/ci/annotate.mjs android.log "android"
      - uses: actions/upload-artifact@v7
        with:
          name: sms-bridge-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
