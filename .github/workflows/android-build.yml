name: android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and assemble
        run: set -o pipefail; ./gradlew --no-daemon --stacktrace test assembleDebug 2>&1 | tee ../android.log
      - if: always()
        working-directory: .
        run: node tools/ci/junit-summary.mjs android/app/build/test-results "android unit"
      - if: failure()
        working-directory: .
        run: node tools/ci/annotate.mjs android.log "android"
      - uses: actions/upload-artifact@v7
        with:
          name: sms-bridge-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  emulator:
    name: Emulator end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and test APKs
        working-directory: android
        run: set -o pipefail; ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest 2>&1 | tee ../emulator-build.log
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/scripts/ci-emulator-test.sh
      - if: always()
        run: node tools/ci/junit-summary.mjs android/app/build/outputs/androidTest-results "emulator"
      - if: failure()
        run: |
          node tools/ci/annotate.mjs emulator-build.log "emulator build"
          node tools/ci/annotate.mjs emulator.log "emulator"
          node tools/ci/annotate.mjs emulator-logcat.txt "logcat"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-logs
          path: |
            emulator.log
            emulator-logcat.txt
          if-no-files-found: ignore

  publish:
    name: Publish dev APK
    needs: [build, emulator]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sms-bridge-apk
      - id: tag
        run: echo "tag=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - run: mv app-debug.apk "sms-bridge-${{ steps.tag.outputs.tag }}.apk"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Dev build ${{ steps.tag.outputs.tag }}
          prerelease: true
          make_latest: false
          body: |
            Automatic development build of ${{ github.sha }}. Not for general use.
            Install the APK on your phone; install the Windows .exe on your PC.
          files: sms-bridge-*.apk
